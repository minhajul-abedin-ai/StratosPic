name: Deploy StratosPic to Azure

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest -q

      - name: Validate Docker build
        run: docker build -t stratospic:ci .

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !.venv/
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F830FD3F965E42F2911E336C8B4B6B29 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2BE93A8DB1E4A74A0E0939851FBBCB6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3743DDFC2D534CAD8BB69BFFB143E374 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: StratosPic
          slot-name: Production
